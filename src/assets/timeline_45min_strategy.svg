<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 155" width="860" height="155">
  <rect x="2" y="2" width="856" height="151" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.3"/>
  <text x="430" y="26" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="13" font-weight="700" fill="#1E3A5F">CHIẾN THUẬT PHÂN BỔ 45 PHÚT LÀM BÀI THỰC CHIẾN — TỐI ĐA HÓA TỪNG 0,25 ĐIỂM</text>

  <!-- Step 1 -->
  <rect x="18" y="42" width="198" height="96" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="18" y="42" width="198" height="24" rx="8" fill="#2563EB"/>
  <text x="117" y="58" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF">CHẶNG 1: PHÚT 00 → 12 (12p)</text>
  <text x="117" y="83" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="10.5" font-weight="700" fill="#1E3A5F">20 câu Phần I (5,0 điểm)</text>
  <text x="117" y="101" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="9.2" fill="#475569">~35 giây/câu • Gạch chân từ khóa</text>
  <text x="117" y="117" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="9.2" fill="#475569">Làm chắc 14 câu Biết trước</text>

  <!-- Arrow 1 -->
  <polygon points="233,90 221,84 221,96" fill="#64748B"/>

  <!-- Step 2 -->
  <rect x="236" y="42" width="198" height="96" rx="8" fill="#F0FDFA" stroke="#14B8A6" stroke-width="1.5"/>
  <rect x="236" y="42" width="198" height="24" rx="8" fill="#0F766E"/>
  <text x="335" y="58" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF">CHẶNG 2: PHÚT 12 → 22 (10p)</text>
  <text x="335" y="83" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="10.5" font-weight="700" fill="#0F766E">2 câu Đúng/Sai (2,0 điểm)</text>
  <text x="335" y="101" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="9.2" fill="#475569">5 phút/câu • Soi từ tuyệt đối</text>
  <text x="335" y="117" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="9.2" fill="#991B1B">Cẩn trọng: sai 1 ý mất 0,5đ!</text>

  <!-- Arrow 2 -->
  <polygon points="451,90 439,84 439,96" fill="#64748B"/>

  <!-- Step 3 -->
  <rect x="454" y="42" width="214" height="96" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <rect x="454" y="42" width="214" height="24" rx="8" fill="#991B1B"/>
  <text x="561" y="58" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF">CHẶNG 3: PHÚT 22 → 41 (19p)</text>
  <text x="561" y="83" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="10.5" font-weight="700" fill="#991B1B">Câu Tự luận 2 vế (3,0 điểm)</text>
  <text x="561" y="101" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="9.2" fill="#475569">6p cho Ý 1 (1,0đ) + 13p cho Ý 2 (2,0đ)</text>
  <text x="561" y="117" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="9.2" fill="#475569">Trình bày tách ý, nêu ví dụ cụ thể</text>

  <!-- Arrow 3 -->
  <polygon points="685,90 673,84 673,96" fill="#64748B"/>

  <!-- Step 4 -->
  <rect x="688" y="42" width="154" height="96" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="688" y="42" width="154" height="24" rx="8" fill="#B45309"/>
  <text x="765" y="58" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF">PHÚT 41 → 45 (4p)</text>
  <text x="765" y="83" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="10.5" font-weight="700" fill="#92400E">Rà soát phiếu đáp án</text>
  <text x="765" y="101" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="9.2" fill="#475569">Đếm đủ 20 câu I + 8 ý II</text>
  <text x="765" y="117" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="9.2" fill="#475569">Kiểm tra từ phủ định</text>
</svg>
