<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 245" width="860" height="245">
  <rect x="2" y="2" width="856" height="241" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
  <rect x="2" y="2" width="856" height="32" rx="12" fill="#1E3A5F"/>
  <text x="430" y="23" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="12.2" font-weight="700" fill="#FFFFFF">BẢN ĐỒ TƯ DUY 09 DI SẢN THẾ GIỚI UNESCO TẠI VIỆT NAM (CẬP NHẬT MỚI NHẤT 2025–2026)</text>

  <!-- Col 1: 6 Cultural -->
  <rect x="16" y="44" width="410" height="186" rx="8" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.2"/>
  <text x="28" y="64" font-family="Be Vietnam Pro, sans-serif" font-size="10.8" font-weight="700" fill="#991B1B">A. DI SẢN VĂN HÓA THẾ GIỚI (06 DI SẢN)</text>
  <text x="28" y="84" font-family="Be Vietnam Pro, sans-serif" font-size="9.4" fill="#1E293B">1. <tspan font-weight="700">Quần thể di tích Cố đô Huế</tspan> (1993 — Huế, di sản TG đầu tiên của VN)</text>
  <text x="28" y="103" font-family="Be Vietnam Pro, sans-serif" font-size="9.4" fill="#1E293B">2. <tspan font-weight="700">Đô thị cổ Hội An</tspan> (1999 — thương cảng cổ thế kỉ XVI–XVIII)</text>
  <text x="28" y="122" font-family="Be Vietnam Pro, sans-serif" font-size="9.4" fill="#1E293B">3. <tspan font-weight="700">Khu đền tháp Mỹ Sơn</tspan> (1999 — trung tâm tôn giáo Chăm-pa cổ)</text>
  <text x="28" y="141" font-family="Be Vietnam Pro, sans-serif" font-size="9.4" fill="#1E293B">4. <tspan font-weight="700">Khu Trung tâm Hoàng thành Thăng Long</tspan> (2010 — Hà Nội, 13 thế kỉ)</text>
  <text x="28" y="160" font-family="Be Vietnam Pro, sans-serif" font-size="9.4" fill="#1E293B">5. <tspan font-weight="700">Thành nhà Hồ</tspan> (2011 — Thanh Hóa, kiến trúc đá vôi độc đáo 1397)</text>
  <text x="28" y="179" font-family="Be Vietnam Pro, sans-serif" font-size="9.4" fill="#991B1B">6. <tspan font-weight="700">Yên Tử – Vĩnh Nghiêm – Côn Sơn, Kiếp Bạc</tspan> (7/2025 — Mới nhất!)</text>
  <text x="40" y="196" font-family="Be Vietnam Pro, sans-serif" font-size="8.8" font-style="italic" fill="#7F1D1D">→ Di sản chuỗi liên tỉnh gắn với Phật giáo Trúc Lâm thời Trần (TK XIII–XIV)</text>
  <text x="28" y="218" font-family="Be Vietnam Pro, sans-serif" font-size="8.9" font-weight="600" fill="#475569">+ DSVH Phi vật thể tiêu biểu: Nhã nhạc Huế, Cồng chiêng TN, Quan họ, Ví Giặm...</text>

  <!-- Col 2 Top: 2 Natural -->
  <rect x="440" y="44" width="404" height="88" rx="8" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.2"/>
  <text x="452" y="64" font-family="Be Vietnam Pro, sans-serif" font-size="10.8" font-weight="700" fill="#0F766E">B. DI SẢN THIÊN NHIÊN THẾ GIỚI (02 DI SẢN)</text>
  <text x="452" y="85" font-family="Be Vietnam Pro, sans-serif" font-size="9.4" fill="#1E293B">7. <tspan font-weight="700">Vịnh Hạ Long – Quần đảo Cát Bà</tspan> (1994, 2000; mở rộng 2023)</text>
  <text x="452" y="105" font-family="Be Vietnam Pro, sans-serif" font-size="9.4" fill="#1E293B">8. <tspan font-weight="700">Vườn quốc gia Phong Nha – Kẻ Bàng</tspan> (2003, 2015; liên biên giới 2025)</text>
  <text x="452" y="122" font-family="Be Vietnam Pro, sans-serif" font-size="8.8" font-style="italic" fill="#0F766E">→ Giá trị địa chất – địa mạo karst, hang động &amp; đa dạng sinh học đặc hữu</text>

  <!-- Col 2 Bottom: 1 Mixed -->
  <rect x="440" y="142" width="404" height="88" rx="8" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.4"/>
  <text x="452" y="162" font-family="Be Vietnam Pro, sans-serif" font-size="10.8" font-weight="700" fill="#B45309">C. DI SẢN HỖN HỢP THẾ GIỚI (01 DI SẢN DUY NHẤT!)</text>
  <text x="452" y="182" font-family="Be Vietnam Pro, sans-serif" font-size="9.5" fill="#1E293B">9. <tspan font-weight="700" fill="#92400E">Quần thể danh thắng Tràng An</tspan> (Ninh Bình — công nhận năm 2014)</text>
  <text x="452" y="200" font-family="Be Vietnam Pro, sans-serif" font-size="9.1" fill="#334155">• Kết hợp Cố đô Hoa Lư + Hang động Tràng An – Tam Cốc – Bích Động + Rừng đặc dụng</text>
  <text x="452" y="217" font-family="Be Vietnam Pro, sans-serif" font-size="8.9" font-weight="700" fill="#991B1B">★ Bẫy trắc nghiệm số 1: Tràng An là DI SẢN HỖN HỢP duy nhất ở VN &amp; ĐNA!</text>
</svg>
